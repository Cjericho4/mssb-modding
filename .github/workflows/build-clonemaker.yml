name: Build Clone Maker (Tauri, Windows)

# Builds the Tauri Clone Maker (tools/clonemaker/app) into one portable MSSB-Clone-Maker.exe (no
# installer; it uses the WebView2 runtime that ships with Windows 10/11), runs the unit tests and
# the exe's own --selftest (every widget and feature, the narrow layout, a timed resize).
# Download it from the run's "Artifacts" section.

on:
  push:
    branches: [main, 'tauri-*']
    tags: ['v*']   # a v1.2.3 tag also attaches the build to that GitHub release
    paths:
      - tools/clonemaker/**
      - tools/datamap/**
      - .github/workflows/build-clonemaker.yml
  workflow_dispatch:

permissions:
  contents: write   # create the release on a tag

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: tools/clonemaker/app

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: tools/clonemaker/app

    - name: Format and lints
      run: |
        cargo fmt --check
        cargo clippy --release -- -D warnings

    - name: Unit tests
      run: |
        cargo test --release
        if (Test-Path ../core/Cargo.toml) { cargo test --release --manifest-path ../core/Cargo.toml }

    - name: Build the .exe
      run: |
        cargo build --release
        Get-ChildItem target/release/* -Include *.exe, *.dll | Format-Table Name, Length   # one portable exe, no DLLs

    # The runner's screen is 1024 x 768: too small for the two-column layout and the wide resize test
    - name: Bigger screen
      continue-on-error: true
      run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

    # A windows-subsystem exe has no console: it writes to --log; the page reports and exits 0 / 1
    - name: Self-test (.exe)
      env:
        MSSB_SHOT_CMD: ${{ github.workspace }}\tools\clonemaker\app\selftest\windows\shot.cmd
        SHOT_DIR: ${{ github.workspace }}\shots
      run: |
        New-Item -ItemType Directory -Force $env:SHOT_DIR | Out-Null
        $p = Start-Process -FilePath target/release/MSSB-Clone-Maker.exe -ArgumentList '--selftest', '--log', 'selftest.log' -PassThru
        $null = $p.Handle   # keeps the exit code readable after WaitForExit
        if (-not $p.WaitForExit(300000)) { Stop-Process -Id $p.Id -Force; throw "the self-test did not finish in 5 minutes" }
        Get-Content selftest.log
        if ($p.ExitCode -ne 0) { throw "MSSB-Clone-Maker.exe --selftest exited with $($p.ExitCode)" }

    - name: Tag matches the app version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        $v = (Get-Content tauri.conf.json | ConvertFrom-Json).version
        if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} but tauri.conf.json says $v" }
        $notes = "$env:GITHUB_WORKSPACE/release-notes/${{ github.ref_name }}.md"
        if (-not (Test-Path $notes) -or (Get-Item $notes).Length -eq 0) { throw "write release-notes/${{ github.ref_name }}.md first (copy release-notes/TEMPLATE.md)" }

    # The Blender exporter (Python scripts, keeping their tools/ layout) rides along with the release
    - name: Zip the Blender exporter
      if: startsWith(github.ref, 'refs/tags/v')
      working-directory: .
      run: |
        $d = "MSSB-Blender-Exporter"
        New-Item -ItemType Directory "$d/tools/datamap", "$d/tools/modding" | Out-Null
        Copy-Item tools/datamap/animations.py, tools/datamap/catalog.py, tools/datamap/disc.py, tools/datamap/export_gltf.py, tools/datamap/formats.py, tools/datamap/mssb_files.py, tools/datamap/sound.py, tools/datamap/stats.py "$d/tools/datamap/"
        Copy-Item tools/modding/clone_character.py "$d/tools/modding/"
        Copy-Item tools/datamap/BLENDER_EXPORT.md "$d/README.md"
        Compress-Archive $d "$d.zip"

    - name: Attach to the release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          tools/clonemaker/app/target/release/MSSB-Clone-Maker.exe
          MSSB-Blender-Exporter.zip
        body_path: release-notes/${{ github.ref_name }}.md   # written by hand from release-notes/TEMPLATE.md
        generate_release_notes: false

    - name: Upload the .exe
      uses: actions/upload-artifact@v4
      with:
        name: MSSB-Clone-Maker-Tauri
        path: tools/clonemaker/app/target/release/MSSB-Clone-Maker.exe
        if-no-files-found: error

    - name: Upload the self-test screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: clonemaker-selftest-screenshots
        path: shots/
        if-no-files-found: ignore
