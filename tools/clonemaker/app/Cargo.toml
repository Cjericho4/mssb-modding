[package]
name = "mssb-clone-maker"
version = "0.2.0-beta"
edition = "2021"
description = "MSSB Clone Maker: the window (Tauri)"
publish = false

[[bin]]
name = "MSSB-Clone-Maker"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mssb-clone-core = { path = "../core" }

[features]
# Embed ui/ into the binary (a plain `cargo build` then makes the portable exe; no tauri-cli needed)
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
